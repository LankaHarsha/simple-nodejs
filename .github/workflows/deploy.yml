name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]

# CRITICAL: These permissions are required for Workload Identity to request the OIDC token
permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: 'simple-nodejs-v2'
  REGION: 'us-central1' # Change this if you created your Artifact Registry in a different region (e.g., asia-south1)
  REPO_NAME: 'github-pool' # Make sure this matches your Artifact Registry repository name
  SERVICE_NAME: 'hello-node-service'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. The Magic Step: Keyless Google Auth
    - name: Google Auth (Workload Identity)
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/371903750543/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-deployer@simple-nodejs-v2.iam.gserviceaccount.com'

    # 2. Configure Docker to use Google's Registry
    - name: Configure Docker Auth
      run: |-
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # 3. Build the Docker Image
    - name: Build Image
      run: |-
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

    # 4. Push the Docker Image
    - name: Push Image
      run: |-
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    # 5. Deploy to Cloud Run
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        region: ${{ env.REGION }}
        flags: '--allow-unauthenticated --port=3030'